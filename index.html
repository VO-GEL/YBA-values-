<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YBA Values</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#f6f6fb;--line:#e4e4ee;--tx:#14141f;--mu:#6b6b80;--ac:#6d3df5;--ok:#12a36b;--warn:#e08a00;--bad:#d9363e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Outfit,system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}
.ib{width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;display:grid;place-items:center;color:var(--tx);padding:0}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{max-width:900px;margin:0 auto;padding:16px}
input,select,button{font-family:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--tx)}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font:600 13px Outfit;white-space:nowrap;color:var(--mu)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;position:relative}
.img{height:110px;display:flex;align-items:center;justify-content:center}
.img img{max-height:100%;max-width:100%;object-fit:contain}
.ph{width:72px;height:72px;border-radius:18px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700}
.badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:#ece6ff;color:var(--ac)}
.card h3{margin:8px 0 4px;font-size:17px}
.big{font-size:26px;font-weight:700}
.st{font-size:13px;font-weight:600;float:right;margin-top:10px}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-top:6px}
.row b{color:var(--tx)}
.bar{display:flex;gap:3px;margin-top:10px}.bar i{flex:1;height:5px;border-radius:3px;background:var(--line)}.bar i.f{background:var(--ok)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:18px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:13px;color:var(--mu);display:block}.f .w{grid-column:1/-1}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600;font-size:15px}
.btn.g{background:#fff;color:var(--tx);border:1px solid var(--line)}.btn.d{background:#fde8e9;color:var(--bad)}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.li img,.li .ph{width:40px;height:40px;font-size:18px;border-radius:10px;object-fit:contain}
.li .n{flex:1;font-weight:600}.li small{display:block;color:var(--mu);font-weight:400}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.side h4{margin:0 0 6px;font-size:15px}.side .v{font-size:22px;font-weight:700;color:var(--ac)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.slot{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;position:relative;background:var(--card);font-size:26px;color:var(--mu);cursor:pointer;padding:4px}
.slot img{max-width:70%;max-height:60%}.slot span{position:absolute;bottom:3px;font-size:11px;font-weight:700;color:var(--tx)}
.slot em{position:absolute;top:3px;left:5px;font-size:11px;font-style:normal;background:#fff;border-radius:6px;padding:0 5px;border:1px solid var(--line)}
.res{border-radius:14px;padding:14px;margin-top:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.win{background:#e3f6ee;color:var(--ok)}.lose{background:#fde8e9;color:var(--bad)}.fair{background:#fff3dc;color:var(--warn)}
.modal{position:fixed;inset:0;background:rgba(20,20,31,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex}.sheet{background:#fff;width:100%;max-width:520px;max-height:80%;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
#menu{position:fixed;inset:0;z-index:8;background:#fff;display:none;overflow:auto;padding:calc(72px + env(safe-area-inset-top,0px)) 16px 24px}
#menu.on{display:block}
.mh{font-size:13px;color:var(--mu);font-weight:600;margin:4px 8px 8px}
.gm{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px;font-weight:600;font-size:17px}
.gm .ph{width:40px;height:40px;font-size:18px;border-radius:10px}.gm svg{margin-left:auto;color:var(--ac)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.mi{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;text-align:left;padding:10px 8px;color:var(--tx)}
.mi .ic{width:50px;height:50px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;background:var(--card);flex:none}
.mi b{display:block;font-size:18px;font-weight:600}.mi small{font-size:15px;color:var(--mu)}
.lock{max-width:380px;margin:30px auto;text-align:center}.lock .btn{width:100%;margin-top:10px}.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:18px}
#sync{font-size:12px;color:var(--mu);margin-top:8px}
</style>
</head>
<body>
<header><h1 id="ttl">YBA Values</h1><button class="ib" id="mb" aria-label="Menu"><svg id="mi"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></header>

<div id="menu">
<div class="mh">GAME</div>
<div class="gm"><div class="ph">Y</div>Your Bizarre Adventure<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div>
<hr>
<button class="mi" data-go="v"><span class="ic"><svg viewBox="0 0 24 24"><path d="M9 4h6v3H9zM7 6H5v14h14V6h-2M9 12h6M9 16h6"/></svg></span><span><b>Value list</b><small>Check current values</small></span></button>
<button class="mi" data-go="c"><span class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2"/></svg></span><span><b>Calculator</b><small>Calculate your trade</small></span></button>
<button class="mi" data-go="o"><span class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></span><span><b>Owner panel</b><small>Add and edit values (locked)</small></span></button>
</div>

<main>
<section id="v"><input id="q" type="search" placeholder="Search stands, skins, items…"><div class="chips" id="chips"></div><div class="grid" id="grid"></div></section>
<section id="c" hidden><div class="panel"><h2>Trade calculator</h2><div class="sides" id="sides"></div><div id="res"></div>
<button class="btn g" style="margin-top:10px" id="clr">Clear trade</button></div></section>
<section id="o" hidden>
<div class="lock" id="lock"><h2>Owner panel</h2><p style="color:var(--mu)">Enter the owner code to continue.</p><input id="pw" type="password" placeholder="Owner code"><button class="btn" id="unlock">Unlock</button><div class="err" id="err"></div></div>
<div id="own" hidden>
<div class="panel"><h2 id="ft">Add an item</h2>
<div class="f">
<div class="w"><label>Name</label><input id="n"></div>
<div><label>Value (e.g. 1.5M, 600K)</label><input id="val"></div>
<div><label>Category</label><select id="cat"><option>Stand</option><option>Skin</option><option>Item</option><option>Shiny</option><option>Other</option></select></div>
<div><label>Rarity</label><select id="rar"><option>Common</option><option>Uncommon</option><option>Rare</option><option>Legendary</option><option selected>Mythic</option></select></div>
<div><label>Demand (1–10)</label><input id="dem" type="number" min="1" max="10" value="5"></div>
<div><label>Trend</label><select id="trd"><option>Rising</option><option selected>Stable</option><option>Falling</option></select></div>
<div><label>Status</label><select id="sta"><option>Overpaid</option><option selected>Fair</option><option>Underpaid</option></select></div>
<div class="w"><label>Image</label><input id="img" type="file" accept="image/*"></div>
</div>
<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="save">Save</button><button class="btn g" id="cancel" hidden>Cancel edit</button></div><div id="sync"></div></div>
<div class="panel"><h2>All items</h2><div id="list"></div><button class="btn g" id="lockb" style="margin-top:12px">Lock panel</button></div>
</div>
</section>
</main>
<div class="modal" id="m"><div class="sheet"><input id="mq" placeholder="Search…" style="margin-bottom:8px"><div id="ml"></div></div></div>
<script>
/* PASTE YOUR FIREBASE DATABASE ADDRESS BETWEEN THE QUOTES, e.g. https://yourname-default-rtdb.firebaseio.com */
const DB='https://yba-values-default-rtdb.firebaseio.com';

const KEY='yba-values-v1',HASH='5d24805756bd5a6daa294fb7b4b9b4c8c82210add14619e8417df60b1e19f566';
const DEFAULTS=[
{id:1,name:'Star Platinum',val:2e6,cat:'Stand',rar:'Legendary',dem:9,trd:'Stable',sta:'Fair',img:''},
{id:2,name:'The World',val:2.5e6,cat:'Stand',rar:'Legendary',dem:10,trd:'Rising',sta:'Fair',img:''},
{id:3,name:'Killer Queen',val:1.2e6,cat:'Stand',rar:'Rare',dem:7,trd:'Stable',sta:'Fair',img:''},
{id:4,name:'Rokakaka',val:150e3,cat:'Item',rar:'Uncommon',dem:6,trd:'Falling',sta:'Overpaid',img:''}];
const online=DB.startsWith('https://'),base=DB.replace(/\/$/,'');
let items=[],trade={me:[null,null,null,null],them:[null,null,null,null]},editId=null,img='',pick=null,cat='All',unlocked=false;
try{items=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
try{unlocked=sessionStorage.getItem('yba-owner')==='1'}catch(e){}
if(!items.length&&!online)items=DEFAULTS;
const $=i=>document.getElementById(i);
const cache=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
const say=t=>$('sync').textContent=t;
async function load(){if(!online)return;try{const r=await fetch(base+'/items.json');if(!r.ok)throw 0;const d=await r.json();items=d?Object.values(d):[];cache();cleanTrade();all()}catch(e){say('Could not reach the database. Showing saved data.')}}
async function put(f){cache();if(!online)return;try{const r=await fetch(base+'/items/'+f.id+'.json',{method:'PUT',body:JSON.stringify(f)});if(!r.ok)throw 0;say('Saved for everyone.')}catch(e){alert('Could not save online. Check your database address and rules.')}}
async function del(id){cache();if(!online)return;try{const r=await fetch(base+'/items/'+id+'.json',{method:'DELETE'});if(!r.ok)throw 0}catch(e){alert('Could not delete online.')}}
const fmt=n=>n>=1e9?+(n/1e9).toFixed(2)+'B':n>=1e6?+(n/1e6).toFixed(2)+'M':n>=1e3?+(n/1e3).toFixed(2)+'K':String(n);
const parse=s=>{const m=String(s).trim().toUpperCase().match(/^([\d.,]+)\s*([KMB])?$/);if(!m)return NaN;return parseFloat(m[1].replace(/,/g,''))*({K:1e3,M:1e6,B:1e9}[m[2]]||1)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pic=f=>f.img?`<img src="${f.img}" alt="">`:`<div class="ph">${esc(f.name[0]||'?')}</div>`;
const stc={Overpaid:'var(--warn)',Fair:'var(--ok)',Underpaid:'var(--bad)'},arr={Rising:'▲ Rising',Stable:'● Stable',Falling:'▼ Falling'};
const titles={v:'YBA Values',c:'Calculator',o:'Owner panel'};
function go(t){['v','c','o'].forEach(s=>$(s).hidden=s!==t);$('ttl').textContent=titles[t];menu(false);scrollTo(0,0);if(t==='o')own();if(t==='v')load()}
function menu(on){$('menu').classList.toggle('on',on);$('mi').innerHTML=on?'<path d="M6 6l12 12M18 6L6 18"/>':'<path d="M4 7h16M4 12h16M4 17h16"/>'}
$('mb').onclick=()=>menu(!$('menu').classList.contains('on'));
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function own(){$('lock').hidden=unlocked;$('own').hidden=!unlocked}
$('unlock').onclick=async()=>{if(await sha($('pw').value)===HASH){unlocked=true;try{sessionStorage.setItem('yba-owner','1')}catch(e){}$('pw').value='';$('err').textContent='';own()}else $('err').textContent='Wrong code. Try again.'};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('unlock').click()};
$('lockb').onclick=()=>{unlocked=false;try{sessionStorage.removeItem('yba-owner')}catch(e){}own()};
function grid(){const q=$('q').value.toLowerCase();
const cats=['All',...new Set(items.map(f=>f.cat))];
$('chips').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');
const l=items.filter(f=>f.name.toLowerCase().includes(q)&&(cat==='All'||f.cat===cat));
$('grid').innerHTML=l.length?l.map(f=>`<div class="card"><span class="badge">${esc(f.rar)}</span><div class="img">${pic(f)}</div><h3>${esc(f.name)}</h3>
<div><span class="st" style="color:${stc[f.sta]}">${f.sta}</span><span class="big">${fmt(f.val)}</span></div>
<div class="bar">${Array.from({length:10},(_,i)=>`<i class="${i<f.dem?'f':''}"></i>`).join('')}</div>
<div class="row"><span>Demand</span><b>${f.dem}/10</b></div><div class="row"><span>Trend</span><b>${arr[f.trd]}</b></div><div class="row"><span>Category</span><b>${esc(f.cat)}</b></div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">Nothing found.</div>'}
$('q').oninput=grid;
$('chips').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;grid()}};
function list(){$('list').innerHTML=items.length?items.map(f=>`<div class="li">${pic(f)}<div class="n">${esc(f.name)}<small>${fmt(f.val)} · ${esc(f.cat)}</small></div><button class="btn g" data-e="${f.id}">Edit</button><button class="btn d" data-d="${f.id}">Delete</button></div>`).join(''):'<div class="empty">Add your first item above.</div>'}
$('list').onclick=async e=>{const d=e.target.dataset;if(d.d){if(!confirm('Delete this item?'))return;items=items.filter(f=>f.id!=d.d);cleanTrade();all();await del(d.d)}
if(d.e){const f=items.find(x=>x.id==d.e);editId=f.id;img=f.img;$('n').value=f.name;$('val').value=fmt(f.val);$('cat').value=f.cat;$('rar').value=f.rar;$('dem').value=f.dem;$('trd').value=f.trd;$('sta').value=f.sta;$('ft').textContent='Edit item';$('cancel').hidden=false;scrollTo(0,0)}};
function reset(){editId=null;img='';['n','val'].forEach(i=>$(i).value='');$('img').value='';$('dem').value=5;$('ft').textContent='Add an item';$('cancel').hidden=true}
$('cancel').onclick=reset;
$('img').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c.toDataURL('image/webp',.85)};im.src=r.result};r.readAsDataURL(file)};
$('save').onclick=async()=>{if(!unlocked)return;const name=$('n').value.trim(),val=parse($('val').value);if(!name)return alert('Enter a name.');if(isNaN(val))return alert('Enter a value like 1.5M or 600K.');
const o={name,val,cat:$('cat').value,rar:$('rar').value,dem:Math.min(10,Math.max(1,+$('dem').value||1)),trd:$('trd').value,sta:$('sta').value,img};
let f;if(editId){f=items.find(x=>x.id==editId);Object.assign(f,o)}else{f={id:Date.now(),...o};items.push(f)}
reset();all();await put(f)};
function cleanTrade(){for(const s in trade)trade[s]=trade[s].map(x=>x&&items.find(f=>f.id==x.id)?x:null)}
function calc(){const sum=s=>trade[s].reduce((a,x)=>{const f=x&&items.find(f=>f.id==x.id);return a+(f?f.val*x.q:0)},0);
const me=sum('me'),th=sum('them'),d=th-me;
$('sides').innerHTML=[['me','You give'],['them','You receive']].map(([s,t])=>`<div class="side"><h4>${t}</h4><div class="v">${fmt(s==='me'?me:th)}</div><div class="slots">${trade[s].map((x,i)=>{const f=x&&items.find(f=>f.id==x.id);return `<div class="slot" data-s="${s}" data-i="${i}">${f?`<em>${x.q}</em>${f.img?`<img src="${f.img}">`:esc(f.name[0])}<span>${fmt(f.val)}</span>`:'+'}</div>`}).join('')}</div></div>`).join('');
const c=Math.abs(d)<=Math.max(me,th)*.03?['fair','Fair trade']:d>0?['win','Win']:['lose','Lose'];
$('res').innerHTML=me+th?`<div class="res ${c[0]}"><span>${c[1]}</span><span>${d>0?'+':d<0?'-':''}${fmt(Math.abs(d))}</span></div>`:''}
$('sides').onclick=e=>{const t=e.target.closest('.slot');if(!t)return;const{s,i}=t.dataset;const x=trade[s][i];
if(x){if(x.q<9)x.q++;else trade[s][i]=null;calc();return}
if(!items.length)return alert('No items yet.');pick={s,i};$('mq').value='';ml();$('m').classList.add('on')};
function ml(){const q=$('mq').value.toLowerCase();$('ml').innerHTML=items.filter(f=>f.name.toLowerCase().includes(q)).map(f=>`<div class="li" data-id="${f.id}">${pic(f)}<div class="n">${esc(f.name)}<small>${fmt(f.val)}</small></div></div>`).join('')||'<div class="empty">Nothing found.</div>'}
$('mq').oninput=ml;
$('ml').onclick=e=>{const r=e.target.closest('.li');if(!r)return;trade[pick.s][pick.i]={id:+r.dataset.id,q:1};$('m').classList.remove('on');calc()};
$('m').onclick=e=>{if(e.target.id==='m')$('m').classList.remove('on')};
$('clr').onclick=()=>{trade={me:[null,null,null,null],them:[null,null,null,null]};calc()};
function all(){grid();list();calc()}
/* ===== STARTER SKINS IMPORT ===== */
const SCALE=1; // 1 = values in Rokas. Change this if your own values use a different scale
const TIER={U:[207,'Common',4],S:[2107,'Mythic',8],'A+':[857,'Legendary',7],'A-':[686,'Rare',6],B:[264,'Uncommon',5],F:[17,'Common',3],G:[700,'Rare',6]};

async function importSkins(){
 if(!unlocked)return;
 if(!confirm('Add 316 skins? Your own items stay. Skins imported before will be reset to the starter values.'))return;
 const rows=SEED.trim().split('\n'),obj={};
 rows.forEach((l,i)=>{const[n,s,t,v]=l.split('|'),T=TIER[t],id=1000+i;
  obj[id]={id,name:n+' · '+s,val:Math.round((+v||T[0])*SCALE*10)/10,cat:'Skin',rar:T[1],dem:T[2],trd:'Stable',sta:'Fair',img:''}});
 try{
  if(online){const r=await fetch(base+'/items.json',{method:'PATCH',body:JSON.stringify(obj)});if(!r.ok)throw 0}
  items=items.filter(f=>!(f.id>=1000&&f.id<1400)).concat(Object.values(obj));cache();all();say('Imported '+rows.length+' skins.');
 }catch(e){alert('Import failed. Check your database address and rules.')}
}
const ib=document.createElement('button');ib.className='btn g';ib.style.marginTop='12px';ib.textContent='Import starter skins';ib.onclick=importSkins;$('lockb').parentNode.appendChild(ib);
all();load();
</script>
